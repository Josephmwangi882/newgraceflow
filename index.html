<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraceFlow</title>
<meta name="theme-color" content="#5C6B5A">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'DM Sans',sans-serif;background:#FAF7F2;color:#2C2420;min-height:100dvh}
.app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#5C6B5A,#3D5C3B)}
.splash-logo{font-family:'Lora',Georgia,serif;font-size:42px;font-weight:600;color:#fff;margin-bottom:8px}
.splash-logo span{color:#F0C990}
.splash-sub{font-size:15px;color:rgba(255,255,255,.7);margin-bottom:48px}
.splash-bar{width:120px;height:3px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.splash-fill{height:100%;background:#F0C990;border-radius:99px;animation:prog 2.5s ease forwards}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;animation:fadeIn .3s ease}
.auth-logo{font-family:'Lora',Georgia,serif;font-size:36px;font-weight:600;color:#5C6B5A;margin-bottom:6px}
.auth-logo span{color:#C8823A}
.auth-sub{font-size:14px;color:#8C7B73;margin-bottom:32px;text-align:center;line-height:1.5}
.auth-card{background:#fff;border-radius:22px;padding:26px 22px;width:100%;border:1px solid #EDE4D6;box-shadow:0 4px 24px rgba(44,36,32,.08)}
.auth-title{font-family:'Lora',Georgia,serif;font-size:20px;color:#2C2420;margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:#8C7B6B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field input{width:100%;background:#FAF7F2;border:1.5px solid #D9CEBA;border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;color:#2C2420;outline:none;transition:border-color .15s}
.field input:focus{border-color:#5C6B5A;background:#fff}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s;margin-top:4px}
.btn:active{opacity:.85}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-moss{background:#5C6B5A;color:#fff}
.btn-red{background:#B85454;color:#fff}
.btn-ghost{background:#F2EDE4;color:#5C4F47}
.auth-switch{text-align:center;margin-top:14px;font-size:14px;color:#8C7B73}
.auth-switch a{color:#5C6B5A;font-weight:600;cursor:pointer}
.msg{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;line-height:1.4}
.msg-error{background:#F0D6D6;color:#B85454}
.msg-success{background:#D4DDD3;color:#3D5C3B}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;background:#FAF7F2;border-bottom:1px solid #EDE4D6;position:sticky;top:0;z-index:20}
.wordmark{font-family:'Lora',Georgia,serif;font-size:20px;font-weight:600;color:#5C6B5A}
.wordmark span{color:#C8823A}
.top-right{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:12px;background:#F2EDE4;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;flex-shrink:0}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#C8823A;border:2px solid #FAF7F2}
.role-badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;background:#D4DDD3;color:#5C6B5A;text-transform:capitalize}
.screen{flex:1;overflow-y:auto;padding-bottom:90px;animation:fadeIn .2s ease}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid #EDE4D6;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 4px;border-radius:12px;border:none;background:transparent}
.nav-item:active{background:#F2EDE4}
.nav-icon{font-size:22px;line-height:1}
.nav-label{font-size:10px;font-weight:500;color:#8C7B73}
.nav-item.active .nav-label{color:#5C6B5A;font-weight:700}
.hero{margin:12px 16px 10px;background:linear-gradient(135deg,#5C6B5A,#3D5C3B);border-radius:22px;padding:24px 22px;color:#fff;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-greeting{font-size:13px;opacity:.75;margin-bottom:3px}
.hero-name{font-family:'Lora',Georgia,serif;font-size:22px;font-weight:600;margin-bottom:16px;letter-spacing:-.3px}
.hero-stats{display:flex;gap:24px}
.stat-num{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat-lbl{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.card{background:#fff;border-radius:18px;padding:18px;margin:0 16px 10px;border:1px solid #EDE4D6;box-shadow:0 2px 10px rgba(44,36,32,.04);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.sec-head{padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-family:'Lora',Georgia,serif;font-size:18px;font-weight:600;color:#2C2420}
.tlink{font-size:13px;font-weight:500;color:#5C6B5A;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px}
.attn{background:linear-gradient(135deg,#7A3B1E,#C8823A);border-radius:16px;padding:14px 18px;margin:0 16px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.attn-lbl{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.attn-title{font-size:15px;color:#fff;font-weight:600;margin-top:2px}
.act-row{display:flex;gap:14px;align-items:flex-start}
.date-blk{background:#F2EDE4;border-radius:12px;padding:8px 10px;text-align:center;min-width:48px;flex-shrink:0}
.date-d{font-size:20px;font-weight:700;color:#5C6B5A;line-height:1}
.date-m{font-size:10px;font-weight:600;color:#8C7B6B;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.pill-green{background:#D4DDD3;color:#3D5C3B}
.pill-amber{background:#F7E8D0;color:#7A4A10}
.pill-red{background:#F0D6D6;color:#B85454}
.assign-hero{margin:4px 16px 10px;background:linear-gradient(135deg,#3D5C3B,#7A8F78);border-radius:20px;padding:20px 22px;color:#fff}
.assign-mini{font-size:12px;opacity:.7;margin-bottom:3px}
.assign-title{font-family:'Lora',Georgia,serif;font-size:18px;font-weight:600;margin-bottom:14px}
.assign-btns{display:flex;gap:10px}
.btn-cf{flex:1;background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;padding:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-dc{flex:1;background:rgba(184,84,84,.25);color:#fff;border:1.5px solid rgba(184,84,84,.4);border-radius:12px;padding:11px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.min-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #F2EDE4;cursor:pointer}
.min-row:last-child{border-bottom:none}
.min-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:#D4DDD3}
.min-name{font-size:15px;font-weight:600;color:#2C2420}
.min-meta{font-size:12px;color:#8C7B73;margin-top:1px}
.person-row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #F2EDE4}
.person-row:last-child{border-bottom:none}
.avatar{width:42px;height:42px;border-radius:50%;background:#D4DDD3;color:#3D5C3B;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.person-name{font-size:15px;font-weight:500;color:#2C2420}
.person-meta{font-size:12px;color:#8C7B73;margin-top:1px}
.wa-btn{width:36px;height:36px;border-radius:10px;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;text-decoration:none}
.ann-target{font-size:11px;font-weight:600;color:#8C7B6B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ann-title{font-family:'Lora',Georgia,serif;font-size:16px;font-weight:600;color:#2C2420;margin-bottom:5px}
.ann-body{font-size:14px;color:#5C4F47;line-height:1.55}
.ann-time{font-size:12px;color:#8C7B73;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(30,20,14,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{background:#FAF7F2;border-radius:26px 26px 0 0;padding:10px 0 40px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.34,1.2,.64,1)}
.handle{width:40px;height:4px;background:#D9CEBA;border-radius:99px;margin:0 auto 16px}
.sheet-title{font-family:'Lora',Georgia,serif;font-size:20px;font-weight:600;color:#2C2420;padding:0 20px;margin-bottom:16px}
.fg{margin:0 16px 13px}
.fl{display:block;font-size:12px;font-weight:600;color:#8C7B6B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fi{width:100%;background:#fff;border:1.5px solid #D9CEBA;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:#2C2420;outline:none}
.fi:focus{border-color:#5C6B5A}
.fs{width:100%;background:#fff;border:1.5px solid #D9CEBA;border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;color:#2C2420;outline:none;appearance:none}
.px{padding:0 16px;margin-bottom:14px}
.empty{text-align:center;padding:48px 30px;color:#8C7B73}
.empty-icon{font-size:44px;margin-bottom:12px;opacity:.6}
.empty-title{font-family:'Lora',Georgia,serif;font-size:17px;color:#5C4F47;margin-bottom:6px}
.empty-sub{font-size:13px;line-height:1.5}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#3D5C3B;color:#fff;padding:12px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:200;white-space:nowrap;animation:toastIn .3s ease}
.skeleton{background:linear-gradient(90deg,#F2EDE4 25%,#EDE4D6 50%,#F2EDE4 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="splash">
    <div class="splash-logo">Grace<span>Flow</span></div>
    <div class="splash-sub">Calm ministry coordination</div>
    <div class="splash-bar"><div class="splash-fill"></div></div>
  </div>
</div>
<script>
window.addEventListener('load',()=>{
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  s.onload=()=>init();
  document.head.appendChild(s);
});
</script>
<script>
const SURL='https://rembeipclfcrvptmhmbo.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlbWJlaXBjbGZjcnZwdG1obWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjY5NzgsImV4cCI6MjA5NTA0Mjk3OH0.STBsx5bMaf7yLXMod6NinRg57wacvuBQ0hsENC-RJSY';
let sb;
let S={user:null,profile:null,screen:'home',modal:null,ministries:[],activities:[],announcements:[],people:[],members:[],loading:true,authMode:'login',hasNotif:true,activeMinistry:null};
const $=id=>document.getElementById(id);
const app=()=>$('app');
const H=new Date().getHours();
const greet=H<12?'Good morning':H<17?'Good afternoon':'Good evening';
const isAdmin=()=>S.profile?.role==='admin';
const isLeader=()=>['admin','leader'].includes(S.profile?.role);
const initials=n=>n?n.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase():'?';
const timeAgo=ts=>{if(!ts)return'';const h=Math.floor((Date.now()-new Date(ts))/3600000);return h<1?'just now':h<24?h+'h ago':Math.floor(h/24)+'d ago';};async function init(){
  sb=supabase.createClient(SURL,SKEY);
  const{data:{session}}=await sb.auth.getSession();
  if(session?.user){S.user=session.user;await loadProfile();}
  else{S.loading=false;renderAuth();}
}
async function loadProfile(){
  const{data}=await sb.from('profiles').select('*').eq('id',S.user.id).single();
  if(data){S.profile=data;await loadData();if(!S.ministries.length)await seedData(data.church_id);await loadData();}
  S.loading=false;render();
}
async function loadData(){
  if(!S.profile?.church_id)return;
  const cid=S.profile.church_id;
  const[m,a,ann,p]=await Promise.all([
    sb.from('ministries').select('*').eq('church_id',cid).order('name'),
    sb.from('activities').select('*').eq('church_id',cid).order('date'),
    sb.from('announcements').select('*').eq('church_id',cid).order('created_at',{ascending:false}),
    sb.from('people').select('*').eq('church_id',cid).order('full_name'),
  ]);
  S.ministries=m.data||[];S.activities=a.data||[];S.announcements=ann.data||[];S.people=p.data||[];
}
async function loadMinMembers(minId){
  const{data}=await sb.from('ministry_members').select('*,person:people(*)').eq('ministry_id',minId);
  S.members=data||[];
}
async function seedData(cid){
  const mins=[{name:'Church',icon:'⛪',church_id:cid,is_default:true},{name:'Leadership',icon:'👑',church_id:cid,is_default:true},{name:'Worship',icon:'🎵',church_id:cid,is_default:false},{name:'Ushers',icon:'🤝',church_id:cid,is_default:false},{name:'Youth',icon:'⚡',church_id:cid,is_default:false},{name:'Media',icon:'🎬',church_id:cid,is_default:false}];
  await sb.from('ministries').upsert(mins,{onConflict:'name,church_id',ignoreDuplicates:true});
  const{data:ml}=await sb.from('ministries').select('*').eq('church_id',cid);
  const w=ml?.find(m=>m.name==='Worship');
  if(w){
    await sb.from('activities').upsert([{title:'Sunday Service',date:'2026-05-25',time:'09:00',ministry_id:w.id,church_id:cid,status:'published'},{title:'Worship Rehearsal',date:'2026-05-28',time:'19:00',ministry_id:w.id,church_id:cid,status:'published'}],{onConflict:'title,date,church_id',ignoreDuplicates:true});
    await sb.from('announcements').upsert([{title:'Sunday Rehearsal Update',body:'Rehearsal moves to 6:30 PM this week.',target:'Worship',church_id:cid,created_at:new Date().toISOString()},{title:'Welcome Team Needed',body:'We need 2 more volunteers for Sunday\'s welcome team.',target:'All Church',church_id:cid,created_at:new Date().toISOString()}],{onConflict:'title,church_id',ignoreDuplicates:true});
  }
}
function render(){
  if(!S.user){renderAuth();return;}
  if(S.loading){renderSkeleton();return;}
  app().innerHTML=`
    <div class="top-bar">
      <span class="wordmark">Grace<span>Flow</span></span>
      <div class="top-right">
        <button class="icon-btn" onclick="openModal('notif')">🔔${S.hasNotif?'<span class="notif-dot"></span>':''}</button>
        <span class="role-badge">${S.profile?.role||'volunteer'}</span>
      </div>
    </div>
    <div class="screen">${buildScreen()}</div>
    <nav class="bottom-nav">${buildTabs()}</nav>
    ${S.modal?buildModal():''}`;
}
function renderSkeleton(){
  app().innerHTML=`<div class="top-bar"><span class="wordmark">Grace<span>Flow</span></span></div><div class="screen"><div style="margin:12px 16px;height:140px;border-radius:22px" class="skeleton"></div><div style="margin:0 16px 10px;height:70px;border-radius:16px" class="skeleton"></div><div style="margin:0 16px 10px;height:90px;border-radius:18px" class="skeleton"></div></div>`;
}
function buildTabs(){
  const tabs=[{id:'home',icon:'🏠',label:'Home'},{id:'timeline',icon:'📅',label:'Timeline'},{id:'announce',icon:'📣',label:'Announce'}];
  if(isLeader())tabs.splice(1,0,{id:'ministries',icon:'✦',label:'Ministries'});
  return tabs.map(t=>`<button class="nav-item ${S.screen===t.id?'active':''}" onclick="nav('${t.id}')"><span class="nav-icon">${t.icon}</span><span class="nav-label">${t.label}</span></button>`).join('');
}
function buildScreen(){
  if(S.screen==='ministries'&&isLeader())return screenMin();
  if(S.screen==='timeline')return screenTimeline();
  if(S.screen==='announce')return screenAnnounce();
  return screenHome();
}
function screenHome(){
  const name=S.profile?.full_name?.split(' ')[0]||'Friend';
  const heroStats=isAdmin()?`<div class="hero-stats"><div><div class="stat-num">${S.activities.length}</div><div class="stat-lbl">Activities</div></div><div><div class="stat-num">${S.ministries.length}</div><div class="stat-lbl">Ministries</div></div><div><div class="stat-num">${S.people.length}</div><div class="stat-lbl">People</div></div></div>`:`<div class="hero-stats"><div><div class="stat-num">2</div><div class="stat-lbl">Serving</div></div><div><div class="stat-num">1</div><div class="stat-lbl">Pending</div></div></div>`;
  const attn=isLeader()?`<div class="attn" onclick="openModal('attention')"><div><div class="attn-lbl">⚠ Needs Attention</div><div class="attn-title">Worship needs a guitarist Sunday</div></div><span style="font-size:22px;color:rgba(255,255,255,.7)">›</span></div>`:'';
  const myAssign=!isLeader()?`<div class="assign-hero" onclick="openModal('assign')"><div class="assign-mini">Worship · Sun 25 May · 9:00 AM</div><div class="assign-title">Sunday Service — Vocalist</div><div class="assign-btns"><button class="btn-cf" onclick="event.stopPropagation();doConfirm()">✓ Confirm</button><button class="btn-dc" onclick="event.stopPropagation()">Can't make it</button></div></div>`:'';
  const acts=S.activities.slice(0,3).map(a=>{const d=new Date(a.date);return`<div class="card" onclick="openModal('act_${a.id}')"><div class="act-row"><div class="date-blk"><div class="date-d">${d.getDate()}</div><div class="date-m">${d.toLocaleString('default',{month:'short'}).toUpperCase()}</div></div><div style="flex:1"><div style="font-size:15px;font-weight:600;margin-bottom:3px">${a.title}</div><div style="font-size:12px;color:#8C7B73;margin-bottom:8px">${a.time||''}</div><span class="pill pill-green">✓ Scheduled</span></div></div></div>`;}).join('')||`<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">No activities yet</div></div>`;
  const anns=S.announcements.slice(0,2).map(a=>`<div class="card"><div class="ann-target">${a.target||'All Church'}</div><div class="ann-title">${a.title}</div><div class="ann-body">${(a.body||'').substring(0,80)}${(a.body||'').length>80?'…':''}</div><div class="ann-time">${timeAgo(a.created_at)}</div></div>`).join('');
  return`<div class="hero"><div class="hero-greeting">${greet},</div><div class="hero-name">${name} 👋</div>${heroStats}</div>${attn}${myAssign}<div class="sec-head"><span class="sec-title">Upcoming</span><button class="tlink" onclick="nav('timeline')">See all</button></div>${acts}<div class="sec-head"><span class="sec-title">Announcements</span><button class="tlink" onclick="nav('announce')">See all</button></div>${anns}`;
}
function screenMin(){
  const list=S.ministries.map(m=>`<div class="min-row" onclick="openMinistry('${m.id}')"><div class="min-icon">${m.icon||'✦'}</div><div style="flex:1"><div class="min-name">${m.name}</div><div class="min-meta">${m.is_default?'Default':'Ministry'}</div></div><span style="font-size:20px;color:#C4B49A">›</span></div>`).join('')||`<div class="empty"><div class="empty-icon">✦</div><div class="empty-title">No ministries yet</div></div>`;
  return`<div class="sec-head"><span class="sec-title">Ministries</span>${isAdmin()?'<button class="tlink" onclick="openModal(\'add_min\')">＋ Add</button>':''}</div><div class="card" style="padding:0;overflow:hidden">${list}</div>`;
}
function screenTimeline(){
  const list=S.activities.map(a=>{const d=new Date(a.date);return`<div class="card" onclick="openModal('act_${a.id}')"><div class="act-row"><div class="date-blk"><div class="date-d">${d.getDate()}</div><div class="date-m">${d.toLocaleString('default',{month:'short'}).toUpperCase()}</div></div><div style="flex:1"><div style="font-size:15px;font-weight:600;margin-bottom:3px">${a.title}</div><div style="font-size:12px;color:#8C7B73;margin-bottom:8px">${a.time||''}</div><span class="pill pill-green">✓ Scheduled</span></div></div></div>`;}).join('')||`<div class="empty"><div class="empty-icon">📅</div><div class="empty-title">Nothing planned yet</div></div>`;
  return`<div class="sec-head"><span class="sec-title">Timeline</span>${isLeader()?'<button class="tlink" onclick="openModal(\'add_act\')">＋ Add</button>':''}</div>${list}`;
}
function screenAnnounce(){
  const list=S.announcements.map(a=>`<div class="card"><div class="ann-target">${a.target||'All Church'}</div><div class="ann-title">${a.title}</div><div class="ann-body">${a.body||''}</div><div class="ann-time">${timeAgo(a.created_at)}</div></div>`).join('')||`<div class="empty"><div class="empty-icon">📣</div><div class="empty-title">No announcements yet</div></div>`;
  return`<div class="sec-head"><span class="sec-title">Announcements</span>${isLeader()?'<button class="tlink" onclick="openModal(\'add_ann\')">＋ New</button>':''}</div>${list}`;
}
async function openMinistry(id){
  S.activeMinistry=S.ministries.find(m=>m.id===id);
  await loadMinMembers(id);
  openModal('min_detail');
}
function modalMinDetail(){
  const m=S.activeMinistry;
  if(!m)return'';
  const memberList=S.members.length?S.members.map(mm=>{
    const p=mm.person;if(!p)return'';
    const ini=initials(p.full_name);
    const roles=(mm.roles||[]).join(', ')||'Volunteer';
    const wa=p.phone?`<a href="https://wa.me/${p.phone.replace(/\D/g,'')}" class="wa-btn" onclick="event.stopPropagation()">💬</a>`:'';
    return`<div class="person-row"><div class="avatar">${ini}</div><div style="flex:1"><div class="person-name">${p.full_name}</div><div class="person-meta">${roles}</div></div>${wa}</div>`;
  }).join(''):`<div class="empty" style="padding:30px"><div class="empty-icon">👥</div><div class="empty-title">No members yet</div><div class="empty-sub">Add people to this ministry.</div></div>`;
  return`<div style="text-align:center;padding:10px 20px 16px"><div style="font-size:44px;margin-bottom:8px">${m.icon||'✦'}</div><div style="font-family:'Lora',Georgia,serif;font-size:22px;font-weight:600">${m.name}</div><div style="font-size:13px;color:#8C7B73;margin-top:3px">${S.members.length} member${S.members.length!==1?'s':''}</div></div><div style="display:flex;gap:10px;padding:0 16px;margin-bottom:16px"><div style="flex:1;background:#F2EDE4;border-radius:14px;padding:12px;text-align:center"><div style="font-size:18px;margin-bottom:3px">📅</div><div style="font-size:15px;font-weight:600">${S.activities.filter(a=>a.ministry_id===m.id).length}</div><div style="font-size:11px;color:#8C7B6B">Activities</div></div><div style="flex:1;background:#F2EDE4;border-radius:14px;padding:12px;text-align:center"><div style="font-size:18px;margin-bottom:3px">👥</div><div style="font-size:15px;font-weight:600">${S.members.length}</div><div style="font-size:11px;color:#8C7B6B">Members</div></div></div><div style="padding:0 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:15px;font-weight:600;color:#2C2420">Members</span>${isLeader()?'<button class="tlink" onclick="openModal(\'add_person\')">＋ Add Person</button>':''}</div><div style="background:#fff;border-radius:16px;margin:0 16px;border:1px solid #EDE4D6;overflow:hidden">${memberList}</div>`;
}
function buildModal(){
  return`<div class="overlay" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="handle"></div>${modalContent()}</div></div>`;
}
function modalContent(){
  const m=S.modal;
  if(m==='notif')return modalNotif();
  if(m==='attention')return modalAttn();
  if(m==='assign')return modalAssign();
  if(m==='add_min')return modalAddMin();
  if(m==='add_act')return modalAddAct();
  if(m==='add_ann')return modalAddAnn();
  if(m==='add_person')return modalAddPerson();
  if(m==='min_detail')return modalMinDetail();
  if(m?.startsWith('act_'))return modalActivity(m.replace('act_',''));
  return'';
}
function modalNotif(){
  S.hasNotif=false;
  return`<div class="sheet-title">Notifications</div>${[{icon:'📋',text:'You have been assigned as Vocalist — Sunday Service · 25 May',time:'2h ago'},{icon:'📣',text:'Announcement: Rehearsal moved to 6:30 PM',time:'5h ago'}].map(n=>`<div style="display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid #F2EDE4;align-items:flex-start"><span style="font-size:22px">${n.icon}</span><div><div style="font-size:14px;color:#2C2420;line-height:1.4">${n.text}</div><div style="font-size:12px;color:#8C7B73;margin-top:3px">${n.time}</div></div></div>`).join('')}`;
}
function modalAttn(){
  return`<div class="sheet-title">Needs Attention</div>${[{icon:'⚠️',label:'Coverage Gap',title:'Worship — guitarist needed Sunday',time:'Sun 25 May · 9:00 AM'},{icon:'⏳',label:'Unconfirmed',title:'3 volunteers haven\'t confirmed',time:'Sun 25 May · 9:00 AM'}].map(i=>`<div style="padding:14px 20px;border-bottom:1px solid #F2EDE4"><div style="display:flex;gap:12px"><span style="font-size:22px">${i.icon}</span><div><div style="font-size:11px;font-weight:600;color:#8C7B6B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${i.label}</div><div style="font-size:15px;font-weight:600;color:#2C2420;margin-bottom:2px">${i.title}</div><div style="font-size:12px;color:#8C7B73">${i.time}</div></div></div></div>`).join('')}`;
}
function modalAssign(){
  return`<div class="sheet-title">Your Assignment</div><div style="margin:0 16px 16px;background:linear-gradient(135deg,#3D5C3B,#7A8F78);border-radius:18px;padding:20px;color:#fff"><div style="font-size:12px;opacity:.7;margin-bottom:3px">Worship · Sun 25 May · 9:00 AM</div><div style="font-family:'Lora',Georgia,serif;font-size:19px;font-weight:600;margin-bottom:3px">Sunday Service</div><div style="font-size:13px;opacity:.75">Role: Vocalist</div></div><div style="padding:0 16px;margin-bottom:16px;font-size:14px;color:#5C4F47;line-height:1.5">Please confirm your availability for this serving slot.</div><div style="display:flex;gap:10px;padding:0 16px"><button class="btn btn-moss" style="margin-top:0" onclick="doConfirm()">✓ Confirm</button><button class="btn btn-red" style="margin-top:0" onclick="closeModal()">Can't make it</button></div>`;
}
function modalActivity(id){
  const a=S.activities.find(x=>x.id===id)||S.activities[0];
  if(!a)return'<div class="sheet-title">Activity</div>';
  const d=new Date(a.date);
  const min=S.ministries.find(m=>m.id===a.ministry_id);
  return`<div class="sheet-title">${a.title}</div><div style="margin:0 16px 14px;background:#F2EDE4;border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div style="font-size:11px;color:#8C7B6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Date</div><div style="font-size:14px;font-weight:500">${d.toDateString()}</div></div><div><div style="font-size:11px;color:#8C7B6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Time</div><div style="font-size:14px;font-weight:500">${a.time||'—'}</div></div><div><div style="font-size:11px;color:#8C7B6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Ministry</div><div style="font-size:14px;font-weight:500">${min?.name||'—'}</div></div><div><div style="font-size:11px;color:#8C7B6B;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Status</div><div style="font-size:14px;font-weight:500;text-transform:capitalize">${a.status||'draft'}</div></div></div><div style="padding:0 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:15px;font-weight:600;color:#2C2420">Assignments</span>${isLeader()?'<button class="tlink">＋ Assign</button>':''}</div><div style="margin:0 16px;background:#fff;border-radius:14px;border:1px solid #EDE4D6;padding:16px;color:#8C7B73;font-size:14px;text-align:center">No assignments yet.</div>`;
}
function modalAddMin(){
  return`<div class="sheet-title">New Ministry</div><div class="fg"><label class="fl">Ministry Name</label><input class="fi" id="mn" placeholder="e.g. Worship, Youth, Media…"></div><div class="fg"><label class="fl">Icon (emoji)</label><input class="fi" id="mi" placeholder="🎵" maxlength="2"></div><div class="px"><button class="btn btn-moss" onclick="saveMin()">Create Ministry</button></div>`;
}
function modalAddAct(){
  const opts=S.ministries.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  return`<div class="sheet-title">New Activity</div><div class="fg"><label class="fl">Title</label><input class="fi" id="at" placeholder="e.g. Sunday Service"></div><div class="fg"><label class="fl">Ministry</label><select class="fs" id="am">${opts}</select></div><div class="fg"><label class="fl">Date</label><input class="fi" id="ad" type="date"></div><div class="fg"><label class="fl">Time</label><input class="fi" id="ati" type="time"></div><div class="px"><button class="btn btn-moss" onclick="saveAct()">Create Activity</button></div>`;
}
function modalAddAnn(){
  const opts=['All Church',...S.ministries.map(m=>m.name)].map(n=>`<option>${n}</option>`).join('');
  return`<div class="sheet-title">New Announcement</div><div class="fg"><label class="fl">Send To</label><select class="fs" id="agt">${opts}</select></div><div class="fg"><label class="fl">Title</label><input class="fi" id="ati2" placeholder="Announcement title…"></div><div class="fg"><label class="fl">Message</label><textarea class="fi" id="ab" rows="4" placeholder="Write your message…" style="resize:none;line-height:1.5"></textarea></div><div class="px"><button class="btn btn-moss" onclick="saveAnn()">Send Announcement</button></div>`;
}
function modalAddPerson(){
  const m=S.activeMinistry;
  return`<div class="sheet-title">Add Person</div><div class="fg"><label class="fl">Full Name</label><input class="fi" id="pn" placeholder="e.g. Sarah Reeves"></div><div class="fg"><label class="fl">Phone (with country code)</label><input class="fi" id="pp" placeholder="254712345678" type="tel"></div><div class="fg"><label class="fl">Role in ${m?.name||'Ministry'}</label><input class="fi" id="pr" placeholder="e.g. Vocalist, Sound, Usher…"></div><div class="px"><button class="btn btn-moss" onclick="savePerson()">Add Person</button></div>`;
}function nav(s){if(s==='ministries'&&!isLeader())return;S.screen=s;render();}
function openModal(n){S.modal=n;render();}
function closeModal(){S.modal=null;render();}
function doConfirm(){closeModal();toast('✓ Confirmed — see you Sunday!');}
function toast(msg,color='#3D5C3B'){
  const t=document.createElement('div');
  t.className='toast';t.style.background=color;t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
async function saveMin(){
  const name=($('mn')?.value||'').trim();
  const icon=($('mi')?.value||'✦').trim();
  if(!name){toast('Please enter a ministry name','#B85454');return;}
  const{error}=await sb.from('ministries').insert({name,icon,church_id:S.profile.church_id,is_default:false});
  if(!error){await loadData();closeModal();toast('✓ Ministry created');}
  else toast('Error: '+error.message,'#B85454');
}
async function saveAct(){
  const title=($('at')?.value||'').trim();
  const min_id=$('am')?.value;
  const date=$('ad')?.value;
  const time=$('ati')?.value;
  if(!title||!date){toast('Please fill in title and date','#B85454');return;}
  const{error}=await sb.from('activities').insert({title,ministry_id:min_id,date,time,church_id:S.profile.church_id,status:'draft'});
  if(!error){await loadData();closeModal();toast('✓ Activity created');}
  else toast('Error: '+error.message,'#B85454');
}
async function saveAnn(){
  const target=$('agt')?.value;
  const title=($('ati2')?.value||'').trim();
  const body=($('ab')?.value||'').trim();
  if(!title||!body){toast('Please fill in title and message','#B85454');return;}
  const{error}=await sb.from('announcements').insert({target,title,body,church_id:S.profile.church_id,created_at:new Date().toISOString()});
  if(!error){await loadData();closeModal();toast('✓ Announcement sent');}
  else toast('Error: '+error.message,'#B85454');
}
async function savePerson(){
  const name=($('pn')?.value||'').trim();
  const phone=($('pp')?.value||'').trim();
  const role=($('pr')?.value||'').trim();
  if(!name){toast('Please enter a name','#B85454');return;}
  const cid=S.profile.church_id;
  const{data:person,error:pe}=await sb.from('people').insert({full_name:name,phone,church_id:cid}).select().single();
  if(pe){toast('Error: '+pe.message,'#B85454');return;}
  if(S.activeMinistry){
    await sb.from('ministry_members').insert({person_id:person.id,ministry_id:S.activeMinistry.id,church_id:cid,roles:role?[role]:[]});
  }
  await loadData();
  await loadMinMembers(S.activeMinistry?.id);
  closeModal();
  toast('✓ Person added');
  openModal('min_detail');
}
function renderAuth(){
  const isLogin=S.authMode==='login';
  app().innerHTML=`
    <div class="auth-screen">
      <div class="auth-logo">Grace<span>Flow</span></div>
      <div class="auth-sub">Calm ministry coordination<br>for East Africa</div>
      <div class="auth-card">
        <div class="auth-title">${isLogin?'Welcome back':'Create your church'}</div>
        <div id="amsg"></div>
        ${!isLogin?'<div class="field"><label>Church Name</label><input id="ach" placeholder="e.g. Redeemer Fellowship"></div>':''}
        ${!isLogin?'<div class="field"><label>Your Full Name</label><input id="afn" placeholder="Pastor John Mwangi"></div>':''}
        <div class="field"><label>Email</label><input id="aem" type="email" placeholder="pastor@church.co.ke" autocomplete="email"></div>
        <div class="field"><label>Password</label><input id="apw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="btn btn-moss" id="abtn" onclick="${isLogin?'doLogin()':'doSignup()'}">
          ${isLogin?'Sign In':'Start 30-Day Free Trial'}
        </button>
        <div class="auth-switch">
          ${isLogin?'New church? <a onclick="toggleAuth()">Start free trial →</a>':'Already registered? <a onclick="toggleAuth()">Sign in →</a>'}
        </div>
      </div>
    </div>`;
}
function toggleAuth(){S.authMode=S.authMode==='login'?'signup':'login';renderAuth();}
function authMsg(msg,type='error'){
  const el=$('amsg');
  if(el)el.innerHTML=`<div class="msg msg-${type}">${msg}</div>`;
}
function setBtn(txt,disabled=false){
  const b=$('abtn');if(b){b.textContent=txt;b.disabled=disabled;}
}
async function doSignup(){
  const church=($('ach')?.value||'').trim();
  const fname=($('afn')?.value||'').trim();
  const email=($('aem')?.value||'').trim();
  const pass=$('apw')?.value;
  if(!church||!fname||!email||!pass){authMsg('Please fill in all fields');return;}
  if(pass.length<6){authMsg('Password must be at least 6 characters');return;}
  setBtn('Creating your church…',true);
  const{data,error}=await sb.auth.signUp({email,password:pass});
  if(error){authMsg(error.message);setBtn('Start 30-Day Free Trial');return;}
  const uid=data.user?.id;
  if(!uid){authMsg('Signup failed. Please try again.');setBtn('Start 30-Day Free Trial');return;}
  const{data:cd,error:ce}=await sb.from('churches').insert({
    name:church,admin_id:uid,
    trial_ends_at:new Date(Date.now()+30*24*60*60*1000).toISOString()
  }).select().single();
  if(ce){authMsg('Error: '+ce.message);setBtn('Start 30-Day Free Trial');return;}
  await sb.from('profiles').insert({id:uid,full_name:fname,email,role:'admin',church_id:cd.id});
  authMsg('Church created! Signing you in…','success');
  S.user=data.user;
  await loadProfile();
}
async function doLogin(){
  const email=($('aem')?.value||'').trim();
  const pass=$('apw')?.value;
  if(!email||!pass){authMsg('Please enter email and password');return;}
  setBtn('Signing in…',true);
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){authMsg(error.message);setBtn('Sign In');return;}
  S.user=data.user;
  await loadProfile();
}
</script>
</body>
</html>
